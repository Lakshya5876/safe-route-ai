spring.application.name=backend
# Falls back to a clearly-invalid placeholder rather than failing to start when
# ORS_API_KEY isn't set (e.g. in tests, or a fresh checkout before the user has
# signed up for a free OpenRouteService key). Live routing calls will then fail
# with ORSRoutingService's normal error handling instead of the whole app
# refusing to boot.
ors.api.key=${ORS_API_KEY:MISSING_ORS_API_KEY-see-backend/.env.example}
